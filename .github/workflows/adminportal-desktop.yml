name: Build adminportal-desktop

on:
  push:
  workflow_dispatch: {}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone teamgram-server
        env:
          SSH_KEY: ${{ secrets.TS_DP_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ts_dp_key
          chmod 600 ~/.ssh/ts_dp_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/ts_dp_key -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:Walker-00/teamgram-server.git src
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev
      - working-directory: src
        run: go build -o adminportal-desktop-linux ./app/adminportal/cmd/adminportal-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: adminportal-desktop-linux
          path: src/adminportal-desktop-linux

  windows:
    runs-on: windows-latest
    steps:
      - name: Clone teamgram-server
        env:
          SSH_KEY: ${{ secrets.TS_DP_KEY }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ts_dp_key
          chmod 600 ~/.ssh/ts_dp_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/ts_dp_key -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:Walker-00/teamgram-server.git src
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - working-directory: src
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go build -o adminportal-desktop.exe ./app/adminportal/cmd/adminportal-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: adminportal-desktop-windows
          path: src/adminportal-desktop.exe
