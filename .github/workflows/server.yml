name: Build teamgram-server

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: teamgram-server
            dockerfile: Dockerfile
          - image: teamgram-adminportal
            dockerfile: app/adminportal/Dockerfile
    steps:
      - name: Clone teamgram-server
        env:
          SSH_KEY: ${{ secrets.TS_DP_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ts_dp_key
          chmod 600 ~/.ssh/ts_dp_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/ts_dp_key -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:Walker-00/teamgram-server.git src

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: src
          file: src/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
